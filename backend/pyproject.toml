[project]
name = "whenshouldgo"
version = "0.1.0"
description = "Travel-only agent runtime for same-day local outings"
requires-python = ">=3.12"
dependencies = [
  "anyio>=3.6.2,<5.0",  # imported directly by the trace middleware; also a Starlette dependency
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",  # OpenRouter transport (runtime; also used by tests)
  "pydantic>=2.7,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# T20 bans print() in app code; telemetry goes through typed sinks only.
extend-select = ["T20"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T20"]
